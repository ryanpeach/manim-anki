[project]
name = "manim-anki-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.11"
dependencies = [
    "genanki>=0.13.1",
    "manim>=0.19.0",
    "numpy>=2.3.4",
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "jupytext>=1.18.1",
    "notebook>=7.4.7",
    "pre-commit>=4.4.0",
    "pyright>=1.1.407",
    "pytest>=9.0.1",
    "ruff>=0.14.5",
]

[tool.uv.sources]
manim-anki = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "decks/*"]

[tool.ruff]
extend-include = ["*.ipynb"]
exclude = ["./submodules"]

[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportPrivateImportUsage = false
reportPossiblyUnboundVariable = false # This happens a lot with juyter notebooks
